name: 定时任务_suite
app: dde-control-center
module: 定时任务
setup:
- action: session_start
  command: dde-control-center
  wait: 3.0
suites:
- id: suite_定时任务_001_s1
  name: 定时关机开关开启/关闭
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      accessible_id: timedPoweroff
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      accessible_id: timedPoweroff
      role: check box
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: timedPoweroff
      role: check box
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: poweroffTime
      role: spin button
- id: suite_定时任务_002_s1
  name: 设置关机时间为09:00
  description: ''
  steps:
  - step_type: action
    action: element_set_value
    selector:
      accessible_id: poweroffTime
      role: spin button
    text: 0900
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: poweroffTime
      role: spin button
- id: suite_定时任务_003_s1
  name: 设置重复方式为每天
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      accessible_id: repeatDays
      role: combo box
    do: click
  - step_type: action
    action: keyboard_type
    text: 每天
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: repeatDays
      role: combo box
- id: suite_定时任务_004_s1
  name: 点击编辑重复日期按钮
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      accessible_id: repeatDaysEdit
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: repeatDaysEdit
      role: push button
teardown:
- action: session_stop
