version: '1.0'
cases:
- id: suite_使用电池_001_s1
  name: 使用电池-低电量通知与低电量操作设置
  module: 使用电池
  steps:
  - step_type: action
    action: element_action
    selector:
      accessible_id: lowBatteryNotification
      role: combo box
    do: click
  - step_type: action
    action: keyboard_type
    text: 20%
  - step_type: action
    action: element_action
    selector:
      accessible_id: lowBatteryOperator
      role: combo box
    do: click
  - step_type: action
    action: keyboard_type
    text: 自动休眠
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: lowBatteryNotification
      role: combo box
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: lowBatteryOperator
      role: combo box
